#:schema node_modules/wrangler/config-schema.json
name = "vanishnote"
# Custom entry: wraps Astro's fetch handler and adds the cron `scheduled` handler.
main = "./src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]

# Serve only on the custom domains below, not on *.workers.dev.
workers_dev = false
routes = [
	{ pattern = "vanishnote.net", custom_domain = true },
	{ pattern = "www.vanishnote.net", custom_domain = true },
]

# Without this, `wrangler dev` rewrites local request URLs to the first route's host
# (vanishnote.net), which switches off the localhost-only dev paths (Turnstile bypass, outbox).
[dev]
host = "localhost"

# Workers Logs record every request URL, and our URLs contain note IDs.
# Keep invocation logging off so note IDs never land in a log store.
[observability]
enabled = false

# Production values. Local dev overrides APP_URL and TURNSTILE_SITE_KEY in .dev.vars
# (see .dev.vars.example); the e2e server overrides them with --var.
[vars]
APP_URL = "https://vanishnote.net"
# Must be an address on a domain verified in Resend.
EMAIL_FROM = "VanishNote <notify@vanishnote.net>"
# Cloudflare Turnstile site key (public). Only works on vanishnote.net; local dev uses the test key.
TURNSTILE_SITE_KEY = "0x4AAAAAAFXWh1b_aO-pNpxf"
# Web Push VAPID public key (base64url, 65-byte uncompressed P-256). Generate with `node scripts/generate-vapid.mjs`.
VAPID_PUBLIC_KEY = "BOJJAdZR3HBusqq_K0QiwlPtq9-aOUEq1xsHkouij8RJFudIJlRh92o_U-sU1pE8P9f2Xeij2Wygj8aCocIFRmk"
VAPID_SUBJECT = "mailto:hello@vanishnote.net"
# Sign in with Google / Microsoft (OpenID Connect). Empty = that button is hidden. The matching
# secrets are GOOGLE_CLIENT_SECRET and MICROSOFT_CLIENT_SECRET. Setup steps: README "Single sign-on".
GOOGLE_CLIENT_ID = ""
MICROSOFT_CLIENT_ID = ""
# Secrets (wrangler secret put / .dev.vars): RESEND_API_KEY, TURNSTILE_SECRET_KEY, VAPID_PRIVATE_KEY,
# GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET

# Encrypted attachments (D1 can't hold values over ~2 MB). Only ciphertext is stored here.
[[r2_buckets]]
binding = "FILES"
bucket_name = "vanishnote-files"

[[d1_databases]]
binding = "DB"
database_name = "vanishnote-db"
database_id = "4065f83d-45a0-43de-9015-a9efe492a511"
migrations_dir = "migrations"

# Hourly cleanup of expired notes.
[triggers]
crons = ["0 * * * *"]

# Per-IP rate limits (Workers Rate Limiting binding). `period` must be 10 or 60.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Sign-up, login, password reset, verification emails.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }