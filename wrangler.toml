#:schema node_modules/wrangler/config-schema.json
name = "vanishnote"
# Custom entry: wraps Astro's fetch handler and adds the cron `scheduled` handler.
main = "./src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]

routes = [
	{ pattern = "vanishnote.net", custom_domain = true },
	{ pattern = "www.vanishnote.net", custom_domain = true },
]

# Workers Logs record every request URL, and our URLs contain note IDs.
# Keep invocation logging off so note IDs never land in a log store.
[observability]
enabled = false

[vars]
APP_URL = "https://vanishnote.net"
# Must be an address on a domain verified in Resend.
EMAIL_FROM = "VanishNote <notify@vanishnote.net>"
# Cloudflare Turnstile site key (public). This is Cloudflare's always-pass test key; replace in production.
TURNSTILE_SITE_KEY = "0x4AAAAAAFXWh1b_aO-pNpxf"
# Web Push VAPID public key (base64url, 65-byte uncompressed P-256). Generate with `node scripts/generate-vapid.mjs`.
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:hello@vanishnote.net"
# Secrets (wrangler secret put / .dev.vars): RESEND_API_KEY, TURNSTILE_SECRET_KEY, VAPID_PRIVATE_KEY
workers_dev = false
# Encrypted attachments (D1 can't hold values over ~2 MB). Only ciphertext is stored here.
[[r2_buckets]]
binding = "FILES"
bucket_name = "vanishnote-files"

[[d1_databases]]
binding = "DB"
database_name = "vanishnote-db"
database_id = "4065f83d-45a0-43de-9015-a9efe492a511"
migrations_dir = "migrations"




# Hourly cleanup of expired notes.
[triggers]
crons = ["0 * * * *"]

# Per-IP rate limits (Workers Rate Limiting binding). `period` must be 10 or 60.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Sign-up, login, password reset, verification emails.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
